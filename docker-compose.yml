services:

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://analyst:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/autonomous_analyst
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: autonomous-data-analyst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autonomous_analyst
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d autonomous_analyst"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
